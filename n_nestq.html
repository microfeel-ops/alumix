        const MIN_SCALE = 0.035;   // 저해상도에서 과도하게 작아지는 것을 막는 최소 스케일

        // --- 모드 스위치 처리 ---
        document.querySelectorAll('input[name="nest-mode"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'fixed') {
                    document.getElementById('mode-fixed-inputs').classList.remove('hidden');
                    document.getElementById('mode-suggest-inputs').classList.add('hidden');
                } else {
                    document.getElementById('mode-fixed-inputs').classList.add('hidden');
                    document.getElementById('mode-suggest-inputs').classList.remove('hidden');
                }
            });
        });

        function resizeCanvas() {
            const container = document.getElementById('canvas-container');
            if(container) {
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
                centerCanvas();
                drawCanvas();
            }
        }
        window.addEventListener('resize', resizeCanvas);

        // --- 엑셀 불러오기 ---
        document.getElementById('excel-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet, {header: 1}); 
                
                panelData = []; totalRequested = {};
                for(let i=1; i<jsonData.length; i++) {
                    let row = jsonData[i];
                    if(!row[0] || !row[1] || !row[2] || !row[3]) continue;
                    let name = String(row[0]), w = parseInt(row[1]), h = parseInt(row[2]), qty = parseInt(row[3]);
                    if(w && h && qty) {
                        panelData.push({name, w, h, qty});
                        totalRequested[name] = (totalRequested[name] || 0) + qty;
                    }
                }
                renderTable();
                alert(`총 ${panelData.length}종목 데이터를 불러왔습니다.`);
            };
            reader.readAsArrayBuffer(file);
            e.target.value = ''; 
        });

        function renderTable() {
            const tbody = document.getElementById('panel-table-body');
            tbody.innerHTML = '';
            panelData.forEach(p => {
                tbody.innerHTML += `
                    <tr class="border-b border-slate-100 hover:bg-slate-50">
                        <td class="px-3 lg:px-4 py-2 whitespace-nowrap">${p.name}</td>
                        <td class="px-3 lg:px-4 py-2">${p.w}</td>
                        <td class="px-3 lg:px-4 py-2">${p.h}</td>
                        <td class="px-3 lg:px-4 py-2 font-bold text-slate-700">${p.qty}</td>
                    </tr>
                `;
            });
        }

        // --- MaxRects Packer 엔진 ---
        class MaxRectsPacker {
            constructor(w, h) {
                this.freeRects = [{x: 0, y: 0, w: w, h: h}];
            }
            pack(w, h) {
                let bestNode = null, bestShortSideFit = Infinity, bestFreeRectIdx = -1;
                for (let i = 0; i < this.freeRects.length; i++) {
                    let fr = this.freeRects[i];
                    if (fr.w >= w && fr.h >= h) {
                        let shortSide = Math.min(fr.w - w, fr.h - h);
                        if (shortSide < bestShortSideFit) {
                            bestNode = {x: fr.x, y: fr.y, w: w, h: h, rotated: false};
                            bestShortSideFit = shortSide; 
                            bestFreeRectIdx = i;
                        }
                    }
                }
                if (bestFreeRectIdx !== -1) {
                    let node = bestNode;
                    let num = this.freeRects.length;
                    for (let i = 0; i < num; ++i) {
                        if (this.splitFreeNode(this.freeRects[i], node)) { this.freeRects.splice(i, 1); i--; num--; }
                    }
                    this.pruneFreeRects();
                    return node;
                }
                return null;
            }
            splitFreeNode(fr, used) {
                if (used.x >= fr.x + fr.w || used.x + used.w <= fr.x || used.y >= fr.y + fr.h || used.y + used.h <= fr.y) return false;
                if (used.x < fr.x + fr.w && used.x + used.w > fr.x) {
                    if (used.y > fr.y && used.y < fr.y + fr.h) this.freeRects.push({x: fr.x, y: fr.y, w: fr.w, h: used.y - fr.y});
                    if (used.y + used.h < fr.y + fr.h) this.freeRects.push({x: fr.x, y: used.y + used.h, w: fr.w, h: fr.y + fr.h - (used.y + used.h)});
                }
                if (used.y < fr.y + fr.h && used.y + used.h > fr.y) {
                    if (used.x > fr.x && used.x < fr.x + fr.w) this.freeRects.push({x: fr.x, y: fr.y, w: used.x - fr.x, h: fr.h});
                    if (used.x + used.w < fr.x + fr.w) this.freeRects.push({x: used.x + used.w, y: fr.y, w: fr.x + fr.w - (used.x + used.w), h: fr.h});
                }
                return true;
            }
            pruneFreeRects() {
                for(let i=0; i<this.freeRects.length; i++) {
                    for(let j=i+1; j<this.freeRects.length; j++) {
                        if (this.isContained(this.freeRects[i], this.freeRects[j])) { this.freeRects.splice(i, 1); i--; break; }
                        if (this.isContained(this.freeRects[j], this.freeRects[i])) { this.freeRects.splice(j, 1); j--; }
                    }
                }
            }
            isContained(a, b) { return a.x >= b.x && a.y >= b.y && a.x+a.w <= b.x+b.w && a.y+a.h <= b.y+b.h; }
        }

        // --- 네스팅 엔진 실행 ---
        document.getElementById('btn-run').addEventListener('click', function() {
            if(panelData.length === 0) return alert("엑셀 데이터를 먼저 불러오세요.");

            let mode = document.querySelector('input[name="nest-mode"]:checked').value;
            let sheetMargin = parseFloat(document.getElementById('sheet-margin').value) || 0;
            let itemGap = parseFloat(document.getElementById('item-gap').value) || 0;
            
            binsResult = []; rectsResult = [];
            
            let itemsToPack = [];
            panelData.forEach(p => { 
                for(let i=0; i<p.qty; i++) itemsToPack.push({name: p.name, w: p.w, h: p.h, packW: p.w + itemGap, packH: p.h + itemGap, area: p.w*p.h}); 
            });
            itemsToPack.sort((a, b) => b.area - a.area);

            if (mode === 'fixed') {
                let sW = parseInt(document.getElementById('fixed-w').value);
                let sH = parseInt(document.getElementById('fixed-h').value);
                let sQ = parseInt(document.getElementById('fixed-q').value) || 9999; 

                if (!sW || !sH) return alert("원판의 폭과 길이를 정확히 입력하세요.");
                if (sW - sheetMargin*2 <= 0 || sH - sheetMargin*2 <= 0) return alert("원판 여백이 너무 큽니다.");

                for (let item of itemsToPack) {
                    let packed = false;
                    for (let b=0; b<binsResult.length; b++) {
                        let node = binsResult[b].packer.pack(item.packW, item.packH);
                        if (node) {
                            rectsResult.push({ binIdx: b, x: node.x + sheetMargin, y: node.y + sheetMargin, w: item.w, h: item.h, name: item.name });
                            packed = true; break;
                        }
                    }
                    if (!packed && binsResult.length < sQ) {
                        let packer = new MaxRectsPacker(sW - sheetMargin*2, sH - sheetMargin*2);
                        binsResult.push({ idx: binsResult.length, w: sW, h: sH, packer: packer });
                        let node = packer.pack(item.packW, item.packH);
                        if (node) {
                            rectsResult.push({ binIdx: binsResult.length - 1, x: node.x + sheetMargin, y: node.y + sheetMargin, w: item.w, h: item.h, name: item.name });
                        }
                    }
                }
            } 
            else if (mode === 'suggest') {
                let sW = parseInt(document.getElementById('suggest-w').value);
                let maxH = parseInt(document.getElementById('suggest-max-h').value);
                
                if (!sW || !maxH) return alert("코일 폭과 최대 허용 길이를 입력하세요.");
                if (sW - sheetMargin*2 <= 0) return alert("원판 여백이 너무 큽니다.");

                for (let item of itemsToPack) {
                    if (item.packH > maxH - sheetMargin*2) {
                        alert(`품목 '${item.name}'의 길이가 허용 최대 길이(${maxH})를 초과하여 배치할 수 없습니다.`);
                        continue;
                    }
                    let packed = false;
                    for (let b=0; b<binsResult.length; b++) {
                        let node = binsResult[b].packer.pack(item.packW, item.packH);
                        if (node) {
                            rectsResult.push({ binIdx: b, x: node.x + sheetMargin, y: node.y + sheetMargin, w: item.w, h: item.h, name: item.name });
                            packed = true; break;
                        }
                    }
                    if (!packed) {
                        let packer = new MaxRectsPacker(sW - sheetMargin*2, maxH - sheetMargin*2);
                        binsResult.push({ idx: binsResult.length, w: sW, h: maxH, packer: packer });
                        let node = packer.pack(item.packW, item.packH);
                        if (node) {
                            rectsResult.push({ binIdx: binsResult.length - 1, x: node.x + sheetMargin, y: node.y + sheetMargin, w: item.w, h: item.h, name: item.name });
                        }
                    }
                }

                let rawLengths = binsResult.map(bin => {
                    let maxY = 0;
                    let binRects = rectsResult.filter(r => r.binIdx === bin.idx);
                    for (let r of binRects) {
                        if (r.y + r.h > maxY) maxY = r.y + r.h;
                    }
                    maxY += sheetMargin; 
                    return Math.ceil(maxY / 50) * 50; 
                });

                let uniqueLengths = [...new Set(rawLengths)].sort((a,b) => a-b);
                while(uniqueLengths.length > 5) {
                    let minDiff = Infinity, mergeIdx = -1;
                    for(let i=0; i<uniqueLengths.length - 1; i++) {
                        let diff = uniqueLengths[i+1] - uniqueLengths[i];
                        if(diff < minDiff) { minDiff = diff; mergeIdx = i; }
                    }
                    let smaller = uniqueLengths[mergeIdx];
                    let larger = uniqueLengths[mergeIdx+1];
                    for(let i=0; i<rawLengths.length; i++) {
                        if(rawLengths[i] === smaller) rawLengths[i] = larger;
                    }
                    uniqueLengths = [...new Set(rawLengths)].sort((a,b) => a-b);
                }

                for (let i=0; i<binsResult.length; i++) {
                    binsResult[i].h = rawLengths[i];
                }
            }

            updateDashboard(mode);
            currentViewIdx = 0;
            setTimeout(() => resizeCanvas(), 50);
        });

        function updateDashboard(mode) {
            let totalReqQty = Object.values(totalRequested).reduce((a,b) => a+b, 0);
            let placedQty = rectsResult.length;
            let unplacedQty = totalReqQty - placedQty;

            let totalReqArea = panelData.reduce((sum, p) => sum + (p.w * p.h * p.qty), 0);
            let totalReqAreaM2 = (totalReqArea / 1000000).toFixed(2);

            let totalSheetArea = 0;
            let binCounts = {};
            binsResult.forEach(b => {
                totalSheetArea += (b.w * b.h);
                let key = `${b.w}x${b.h}`;
                binCounts[key] = (binCounts[key] || 0) + 1;
            });
            let totalSheetAreaM2 = (totalSheetArea / 1000000).toFixed(2);
            
            let binDetails = Object.keys(binCounts).map(k => `<span class="inline-block bg-white px-2 py-1 rounded border border-slate-200">${k} (<b class="text-blue-600">${binCounts[k]}장</b>)</span>`).join(' ');
            
            let totalRectArea = rectsResult.reduce((sum, r) => sum + (r.w * r.h), 0);
            let lossRate = totalSheetArea > 0 ? (((totalSheetArea - totalRectArea) / totalSheetArea) * 100).toFixed(1) : "0.0";

            let modeTitle = mode === 'fixed' ? "단일 규격 네스팅 결과" : "<span class='text-emerald-600'>최적 커팅 길이 제안 결과</span>";

            const dashHtml = `
                <div class="flex flex-col xl:flex-row gap-4 w-full">
                    <div class="flex-1 bg-slate-50 rounded-lg p-3 lg:p-4 border border-slate-200 shadow-sm">
                        <div class="text-sm font-bold text-slate-800 mb-2 border-b pb-1">📦 품목 물량 (요청 기준)</div>
                        <div class="text-xs lg:text-[13px] text-slate-600">
                            총 요청: <b>${totalReqQty}</b>개 <span class="mx-2 text-slate-300">|</span> 
                            물량: <b class="text-blue-600 text-sm">${totalReqAreaM2} ㎡</b>
                        </div>
                        <div class="text-[11px] lg:text-[12px] text-slate-500 mt-1">
                            (배치: ${placedQty}개 / 미배치: <span class="text-red-500">${unplacedQty}개</span>)
                        </div>
                    </div>
                    <div class="flex-[2] bg-slate-50 rounded-lg p-3 lg:p-4 border border-slate-200 shadow-sm">
                        <div class="text-sm font-bold text-slate-800 mb-2 border-b pb-1 flex flex-wrap justify-between gap-2">
                            <span>🗂️ ${modeTitle} (총 ${binsResult.length}장)</span>
                            <div class="flex gap-2 lg:gap-4">
                                <span class="text-emerald-600 font-bold">소요: ${totalSheetAreaM2} ㎡</span>
                                <span class="text-amber-600 font-bold bg-amber-100 px-1 lg:px-2 rounded">로스율: ${lossRate}%</span>
                            </div>
                        </div>
                        <div class="text-xs lg:text-[13px] text-slate-600 flex flex-wrap gap-2 items-center mt-2">
                            ${binDetails}
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('dashboard').innerHTML = dashHtml;
            document.getElementById('dashboard').classList.remove('justify-center');

            let placedTrack = {};
            rectsResult.forEach(r => {
                placedTrack[r.name] = (placedTrack[r.name] || 0) + 1;
                r.dispText = `${r.name}\n${r.w}x${r.h}\n(${placedTrack[r.name]}/${totalRequested[r.name]})`;
            });

            if(unplacedQty > 0) {
                alert(`⚠️ 자재 부족!\n수량이 부족하거나 규격에 맞지 않아 총 ${unplacedQty}개의 패널이 배치되지 못했습니다.`);
            }
        }

        // --- 캔버스 렌더링 ---
        document.getElementById('view-mode').addEventListener('change', () => { currentViewIdx = 0; centerCanvas(); drawCanvas(); });

        function centerCanvas() {
            if(binsResult.length === 0) return;
            const container = document.getElementById('canvas-container');
            let viewMode = document.getElementById('view-mode').value;
            let startIdx = currentViewIdx;
            let count = viewMode === 'double' ? 2 : (viewMode === 'all' ? binsResult.length : 1);
            let endIdx = Math.min(startIdx + count, binsResult.length);

            // 1. 전체 원판 데이터 중 '최대 폭'과 '최대 높이'를 전역 기준으로 추출 (페이지 전환 시 배율 고정)
            let globalMaxW = 0, globalMaxH = 0;
            binsResult.forEach(bin => {
                globalMaxW = Math.max(globalMaxW, bin.w);
                globalMaxH = Math.max(globalMaxH, bin.h);
            });

            let refW = globalMaxW;
            if(viewMode === 'all') {
                refW = binsResult.reduce((sum, b) => sum + b.w, 0) + (binsResult.length - 1) * 500;
            } else if(viewMode === 'double') {
                refW = globalMaxW * 2 + 500;
            }

            let currentW = 0, currentH = 0;
            for(let i = startIdx; i < endIdx; i++) {
                currentW += binsResult[i].w;
                if (i > startIdx) currentW += 500;
                currentH = Math.max(currentH, binsResult[i].h);
            }
            if (currentW === 0) { currentW = binsResult[startIdx].w; currentH = binsResult[startIdx].h; }

            // 2. 상·하·좌·우 '절대 안전 여백' 설정 (px 단위)
            const SAFE_TOP = 40;     // 도면이 천장에 붙는 것을 막는 최소 상단 여백
            const SAFE_BOTTOM = 85;  // 하단 라벨 텍스트(Sheet 이름, 로스율)가 쓰일 전용 보장 공간
            const SAFE_SIDE = 30;    // 좌우 여백

            let availW = container.clientWidth - (SAFE_SIDE * 2);
            let availH = container.clientHeight - (SAFE_TOP + SAFE_BOTTOM);

            // 3. 전역 최대 규격(globalMaxH)으로 스케일 계산
            let scaleW = availW / refW;
            let scaleH = availH / globalMaxH;
            let finalScale = Math.min(scaleW, scaleH);

            if (finalScale < MIN_SCALE) finalScale = Math.max(scaleW, MIN_SCALE);
            transform.scale = finalScale;

            // 4. 화면 정중앙 좌표 계산 (상단 40px 아래로 단단히 고정)
            let drawW = currentW * finalScale;
            let drawH = currentH * finalScale;

            transform.x = (container.clientWidth - drawW) / 2;
            transform.y = Math.max(SAFE_TOP, (container.clientHeight - drawH - SAFE_BOTTOM) / 2);
        }

        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if(binsResult.length === 0) return;

            let viewMode = document.getElementById('view-mode').value;
            let startIdx = 0, endIdx = binsResult.length;
            let pLabel = document.getElementById('page-label');

            if(viewMode === 'all') { pLabel.innerText = `전체 ${binsResult.length}장`; } 
            else if(viewMode === 'single') { startIdx = currentViewIdx; endIdx = Math.min(startIdx + 1, binsResult.length); pLabel.innerText = `페이지: ${startIdx+1} / ${binsResult.length}`; } 
            else if(viewMode === 'double') { startIdx = currentViewIdx; endIdx = Math.min(startIdx + 2, binsResult.length); pLabel.innerText = `페이지: ${startIdx+1}~${endIdx} / ${binsResult.length}`; }

            ctx.save();
            ctx.translate(transform.x, transform.y);
            ctx.scale(transform.scale, transform.scale);

            let xOffset = 0;
            for(let i = startIdx; i < endIdx; i++) {
                let bin = binsResult[i];
                let binRects = rectsResult.filter(r => r.binIdx === i);
                
                let sheetAreaM2 = ((bin.w * bin.h) / 1000000).toFixed(2);
                let usedRectArea = binRects.reduce((sum, r) => sum + (r.w * r.h), 0);
                let lossRate = (((bin.w * bin.h) - usedRectArea) / (bin.w * bin.h) * 100).toFixed(1);

                ctx.strokeStyle = '#30343a'; ctx.lineWidth = 2 / transform.scale; 
                ctx.strokeRect(xOffset, 0, bin.w, bin.h);
                
                ctx.fillStyle = '#1c2b5c';
                let sheetLabel1 = `Sheet ${i+1} (${bin.w}x${bin.h})`;
                let sheetLabel2 = `물량: ${sheetAreaM2}㎡ / 로스율: ${lossRate}%`;

                // 화면상 항상 동일한 글자 크기로 보이도록 스케일을 역보정(고정 px). 
                // 시트 폭에 비례하던 기존 방식은 시트마다 글자 크기가 달라지고 여백 예약치와 어긋나 잘림이 발생했음.
                ctx.textAlign = 'center';

                ctx.font = `bold ${15 / transform.scale}px 'Malgun Gothic'`;
                ctx.fillText(sheetLabel1, xOffset + bin.w/2, bin.h + LABEL_GAP1_PX / transform.scale);

                ctx.font = `bold ${12.5 / transform.scale}px 'Malgun Gothic'`; 
                ctx.fillText(sheetLabel2, xOffset + bin.w/2, bin.h + LABEL_GAP2_PX / transform.scale);

                for(let r of binRects) {
                    ctx.fillStyle = '#eaf2ff'; ctx.fillRect(xOffset + r.x, r.y, r.w, r.h);
                    ctx.strokeStyle = '#4c8dff'; ctx.lineWidth = 1 / transform.scale; ctx.strokeRect(xOffset + r.x, r.y, r.w, r.h);

                    ctx.beginPath();
                    let cx = xOffset + r.x + r.w/2; let cy = r.y + r.h/2;
                    let ah = r.h/4; 
                    
                    ctx.moveTo(cx, cy - ah); ctx.lineTo(cx, cy + ah);
                    let arrSz = 12 / transform.scale;
                    ctx.lineTo(cx - arrSz, cy + ah - arrSz); ctx.moveTo(cx, cy + ah); ctx.lineTo(cx + arrSz, cy + ah - arrSz);
                    ctx.moveTo(cx, cy - ah); ctx.lineTo(cx - arrSz, cy - ah + arrSz); ctx.moveTo(cx, cy - ah); ctx.lineTo(cx + arrSz, cy - ah + arrSz);
                    
                    ctx.strokeStyle = '#2eaf7d'; ctx.lineWidth = 1.5 / transform.scale; ctx.stroke();

                    ctx.fillStyle = '#1c2b5c';
                    let lines = r.dispText.split('\n');
                    let fontSize = calcFitFontSize(r.w, r.h, lines.length, transform.scale, lines);
                    ctx.font = `${fontSize}px 'Malgun Gothic'`;
                    ctx.textBaseline = 'middle';
                    let lineH = fontSize * 1.25;
                    let startY = r.y + (r.h/2) - (lineH * (lines.length-1) / 2);
                    
                    for(let l=0; l<lines.length; l++) ctx.fillText(lines[l], cx, startY + (l * lineH));
                }
                xOffset += bin.w + 500; 
            }
            ctx.restore();
        }

        function calcFitFontSize(w, h, lineCount, scale, lines) {
            let base = (w < 200 || h < 200) ? 12/scale : 16/scale;
            let blockH = base * 1.25 * lineCount;
            if (blockH > h * 0.8) base *= (h * 0.8 / blockH);
            let maxChars = Math.max(...lines.map(l => l.length));
            let estW = maxChars * base * 0.6;
            if (estW > w * 0.9) base *= (w * 0.9 / estW);
            return base;
        }

        // --- 마우스 및 터치(모바일) 이벤트 ---
        function startDrag(clientX, clientY) {
            isDragging = true;
            dragStart = { x: clientX - transform.x, y: clientY - transform.y };
        }
        function moveDrag(clientX, clientY) {
            if(!isDragging) return;
            transform.x = clientX - dragStart.x;
            transform.y = clientY - dragStart.y;
            drawCanvas();
        }

        canvas.addEventListener('mousedown', (e) => startDrag(e.offsetX, e.offsetY));
        canvas.addEventListener('mousemove', (e) => moveDrag(e.offsetX, e.offsetY));
        canvas.addEventListener('mouseup', () => isDragging = false); 
        canvas.addEventListener('mouseleave', () => isDragging = false);
        
        canvas.addEventListener('touchstart', (e) => {
            if(e.touches.length === 1) startDrag(e.touches[0].clientX, e.touches[0].clientY);
        }, {passive: false});
        canvas.addEventListener('touchmove', (e) => {
            if(isDragging && e.touches.length === 1) {
                e.preventDefault(); 
                moveDrag(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, {passive: false});
        canvas.addEventListener('touchend', () => isDragging = false);
        canvas.addEventListener('touchcancel', () => isDragging = false);

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            if(zoomMode) {
                const scaleAmount = 1 + ((e.deltaY > 0 ? -1 : 1) * 0.1);
                transform.x = e.offsetX - (e.offsetX - transform.x) * scaleAmount;
                transform.y = e.offsetY - (e.offsetY - transform.y) * scaleAmount;
                transform.scale *= scaleAmount; drawCanvas();
            } else { changePage(e.deltaY > 0 ? 1 : -1); }
        });

        function changePage(direction) {
            let viewMode = document.getElementById('view-mode').value;
            if(viewMode === 'all' || binsResult.length === 0) return;
            let step = viewMode === 'single' ? 1 : 2;
            if(direction > 0 && currentViewIdx + step < binsResult.length) currentViewIdx += step;
            else if(direction < 0 && currentViewIdx - step >= 0) currentViewIdx -= step;
            centerCanvas(); drawCanvas();
        }

        window.addEventListener('keydown', (e) => {
            if(e.key === 'ArrowRight' || e.key === 'ArrowDown') changePage(1);
            else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp') changePage(-1);
        });
        document.getElementById('btn-prev').addEventListener('click', () => changePage(-1));
        document.getElementById('btn-next').addEventListener('click', () => changePage(1));
        
        document.getElementById('btn-zoom').addEventListener('click', function() {
            zoomMode = !zoomMode;
            this.className = zoomMode ? "bg-blue-500 hover:bg-blue-600 text-white p-1 lg:p-1.5 rounded ml-1 lg:ml-2" : "bg-slate-100 hover:bg-slate-200 text-slate-600 p-1 lg:p-1.5 rounded ml-1 lg:ml-2";
        });

        function toDxfUnicode(str) {
            let res = '';
            for (let i = 0; i < str.length; i++) {
                let code = str.charCodeAt(i);
                res += code > 127 ? '\\U+' + code.toString(16).toUpperCase().padStart(4, '0') : str[i];
            } return res;
        }

        function drawDxfPolyline(layer, color, points) {
            let res = `0\nPOLYLINE\n8\n${layer}\n62\n${color}\n66\n1\n70\n1\n`;
            for(let pt of points) res += `0\nVERTEX\n8\n${layer}\n10\n${pt.x}\n20\n${pt.y}\n`;
            res += `0\nSEQEND\n8\n${layer}\n`; return res;
        }

        // --- DXF 저장 ---
        document.getElementById('btn-dxf').addEventListener('click', function() {
            if(binsResult.length === 0) return alert("저장할 데이터가 없습니다.");
            let dxf = "0\nSECTION\n2\nHEADER\n9\n$ACADVER\n1\nAC1009\n0\nENDSEC\n0\nSECTION\n2\nTABLES\n0\nTABLE\n2\nLAYER\n70\n4\n";
            dxf += "0\nLAYER\n2\nSHEET\n70\n0\n62\n1\n6\nCONTINUOUS\n"; 
            dxf += "0\nLAYER\n2\nPANEL\n70\n0\n62\n5\n6\nCONTINUOUS\n"; 
            dxf += "0\nLAYER\n2\nTEXT\n70\n0\n62\n7\n6\nCONTINUOUS\n";  
            dxf += "0\nLAYER\n2\nGRAIN\n70\n0\n62\n3\n6\nCONTINUOUS\n";
            dxf += "0\nENDTAB\n0\nENDSEC\n0\nSECTION\n2\nENTITIES\n";
            
            let xOffset = 0;
            for(let i=0; i<binsResult.length; i++) {
                let bin = binsResult[i], sx = xOffset, sy = 0, sw = bin.w, sh = bin.h;
                let binRects = rectsResult.filter(r => r.binIdx === i);

                let sheetAreaM2 = ((bin.w * bin.h) / 1000000).toFixed(2);
                let usedRectArea = binRects.reduce((sum, r) => sum + (r.w * r.h), 0);
                let lossRate = (((bin.w * bin.h) - usedRectArea) / (bin.w * bin.h) * 100).toFixed(1);

                dxf += drawDxfPolyline('SHEET', 1, [{x: sx, y: sy}, {x: sx+sw, y: sy}, {x: sx+sw, y: sh}, {x: sx, y: sh}]);

                // DXF 텍스트 라벨 비례값 적용 (Y좌표는 음수로 내려서 시트 하단에 배치)
                let sheetLabel1 = `Sheet ${i+1} (${bin.w}x${bin.h})`;
                let sheetLabel2 = `물량: ${sheetAreaM2}㎡ / 로스율: ${lossRate}%`;
                
                let shTh1 = bin.w * 0.035;
                let shLx1 = sx + bin.w/2 - (toDxfUnicode(sheetLabel1).length * shTh1 * 0.6 / 2);
                let shLy1 = -shTh1 * 1.5;
                dxf += `0\nTEXT\n8\nTEXT\n10\n${shLx1}\n20\n${shLy1}\n40\n${shTh1}\n1\n${toDxfUnicode(sheetLabel1)}\n`;

                let shTh2 = shTh1 * 0.8;
                let shLx2 = sx + bin.w/2 - (toDxfUnicode(sheetLabel2).length * shTh2 * 0.6 / 2);
                let shLy2 = -shTh1 * 3.0; 
                dxf += `0\nTEXT\n8\nTEXT\n10\n${shLx2}\n20\n${shLy2}\n40\n${shTh2}\n1\n${toDxfUnicode(sheetLabel2)}\n`;

                for(let r of binRects) {
                    let px = xOffset + r.x, py = r.y, cx = px + r.w/2, cy = py + r.h/2;
                    dxf += drawDxfPolyline('PANEL', 5, [{x: px, y: py}, {x: px+r.w, y: py}, {x: px+r.w, y: py+r.h}, {x: px, y: py+r.h}]);

                    let ah = r.h/4, arrSz = 30;
                    dxf += `0\nLINE\n8\nGRAIN\n10\n${cx}\n20\n${cy-ah}\n11\n${cx}\n21\n${cy+ah}\n`;
                    dxf += `0\nLINE\n8\nGRAIN\n10\n${cx}\n20\n${cy+ah}\n11\n${cx-arrSz}\n21\n${cy+ah-arrSz}\n`;
                    dxf += `0\nLINE\n8\nGRAIN\n10\n${cx}\n20\n${cy+ah}\n11\n${cx+arrSz}\n21\n${cy+ah-arrSz}\n`;
                    dxf += `0\nLINE\n8\nGRAIN\n10\n${cx}\n20\n${cy-ah}\n11\n${cx-arrSz}\n21\n${cy-ah+arrSz}\n`;
                    dxf += `0\nLINE\n8\nGRAIN\n10\n${cx}\n20\n${cy-ah}\n11\n${cx+arrSz}\n21\n${cy-ah+arrSz}\n`;

                    let rawLines = r.dispText.split('\n'), lineCount = rawLines.length;
                    let th = Math.min(r.w, r.h) * 0.15;
                    if (th * 1.25 * lineCount > r.h * 0.8) th *= (r.h * 0.8 / (th * 1.25 * lineCount));
                    let maxChars = Math.max(...rawLines.map(l => l.length));
                    if (maxChars * th * 0.6 > r.w * 0.9) th *= (r.w * 0.9 / (maxChars * th * 0.6));

                    let lineH = th * 1.25, firstLineY = py + r.h/2 + (lineH * lineCount/2) - (lineH/2); 
                    for (let li = 0; li < lineCount; li++) {
                        let lx = cx - (rawLines[li].length * th * 0.6 / 2);
                        dxf += `0\nTEXT\n8\nTEXT\n10\n${lx}\n20\n${firstLineY - (li * lineH)}\n40\n${th}\n1\n${toDxfUnicode(rawLines[li])}\n`;
                    }
                }
                xOffset += bin.w + 500;
            }
            dxf += "0\nENDSEC\n0\nEOF\n";
            dxf = dxf.replace(/\n/g, '\r\n');
            const blob = new Blob([dxf], {type: 'text/plain;charset=utf-8'}), a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = `Nesting_DXF_${new Date().toISOString().slice(0,10)}.dxf`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a);
        });

        // --- PDF 저장 ---
        document.getElementById('btn-pdf').addEventListener('click', async function() {
            if(binsResult.length === 0) return alert("저장할 데이터가 없습니다.");
            const { jsPDF } = window.jspdf;
            const btn = this, origHtml = btn.innerHTML;
            btn.innerHTML = '⏳ 생성중..'; btn.disabled = true;

            try {
                await new Promise(r => setTimeout(r, 50));
                let pdf = null;
                for(let i = 0; i < binsResult.length; i++) {
                    let bin = binsResult[i], binRects = rectsResult.filter(r => r.binIdx === i);
                    
                    let baseFont = bin.w * 0.035; 
                    let bottomMargin = bin.w * 0.15; 
                    const PADDING = bin.w * 0.1; 
                    
                    let scaleK = 2000 / Math.max(bin.w, bin.h);
                    let tCanvas = document.createElement('canvas');
                    tCanvas.width = (bin.w + PADDING * 2) * scaleK; 
                    tCanvas.height = (bin.h + bottomMargin + PADDING * 2) * scaleK; 
                    
                    let tctx = tCanvas.getContext('2d');
                    tctx.fillStyle = '#ffffff'; tctx.fillRect(0, 0, tCanvas.width, tCanvas.height);
                    tctx.save(); 
                    tctx.translate(PADDING * scaleK, PADDING * scaleK); 
                    tctx.scale(scaleK, scaleK);

                    tctx.strokeStyle = '#30343a'; tctx.lineWidth = 2 / scaleK; tctx.strokeRect(0, 0, bin.w, bin.h);
                    
                    let sheetAreaM2 = ((bin.w * bin.h) / 1000000).toFixed(2);
                    let usedRectArea = binRects.reduce((sum, r) => sum + (r.w * r.h), 0);
                    let lossRate = (((bin.w * bin.h) - usedRectArea) / (bin.w * bin.h) * 100).toFixed(1);
                    
                    let sheetLabel1 = `Sheet ${i+1} (${bin.w}x${bin.h})`;
                    let sheetLabel2 = `물량: ${sheetAreaM2}㎡ / 로스율: ${lossRate}%`;

                    tctx.fillStyle = '#1c2b5c'; 
                    tctx.textAlign = 'center'; 
                    
                    tctx.font = `bold ${baseFont}px 'Malgun Gothic'`;
                    tctx.fillText(sheetLabel1, bin.w/2, bin.h + baseFont * 1.5);
                    
                    tctx.font = `bold ${baseFont * 0.8}px 'Malgun Gothic'`;
                    tctx.fillText(sheetLabel2, bin.w/2, bin.h + baseFont * 3.0);

                    for(let r of binRects) {
                        tctx.fillStyle = '#eaf2ff'; tctx.fillRect(r.x, r.y, r.w, r.h);
                        tctx.strokeStyle = '#4c8dff'; tctx.lineWidth = 1.5 / scaleK; tctx.strokeRect(r.x, r.y, r.w, r.h);

                        tctx.beginPath();
                        let ah = r.h/4, arrSz = 12 / scaleK;
                        let cx = r.x + r.w/2, cy = r.y + r.h/2;
                        tctx.moveTo(cx, cy - ah); tctx.lineTo(cx, cy + ah);
                        tctx.lineTo(cx - arrSz, cy + ah - arrSz); tctx.moveTo(cx, cy + ah); tctx.lineTo(cx + arrSz, cy + ah - arrSz);
                        tctx.moveTo(cx, cy - ah); tctx.lineTo(cx - arrSz, cy - ah + arrSz); tctx.moveTo(cx, cy - ah); tctx.lineTo(cx + arrSz, cy - ah + arrSz);
                        tctx.strokeStyle = '#2eaf7d'; tctx.lineWidth = 2 / scaleK; tctx.stroke();

                        tctx.fillStyle = '#1c2b5c';
                        let lines = r.dispText.split('\n');
                        let fSz = calcFitFontSize(r.w, r.h, lines.length, scaleK, lines);
                        tctx.font = `${fSz}px 'Malgun Gothic'`; tctx.textBaseline = 'middle';
                        let lineH = fSz * 1.3, startY = r.y + (r.h/2) - (lineH * (lines.length-1) / 2);
                        for(let l=0; l<lines.length; l++) tctx.fillText(lines[l], r.x + r.w/2, startY + (l * lineH));
                    }
                    tctx.restore();

                    const imgData = tCanvas.toDataURL('image/jpeg', 0.92);
                    const orient = tCanvas.width >= tCanvas.height ? 'l' : 'p';
                    if(!pdf) pdf = new jsPDF({ orientation: orient, unit: 'px', format: [tCanvas.width, tCanvas.height] });
                    else pdf.addPage([tCanvas.width, tCanvas.height], orient);
                    pdf.addImage(imgData, 'JPEG', 0, 0, tCanvas.width, tCanvas.height);
                }
                
                let defaultName = `Nesting_Result_${new Date().toISOString().slice(0,10)}`;
                let fileName = prompt("PDF 파일명을 입력하세요 (확장자 제외)", defaultName);
                if (fileName === null) { 
                    btn.innerHTML = origHtml;
                    btn.disabled = false;
                    return;
                }
                if (!fileName.trim()) fileName = defaultName;

                const pdfBlob = pdf.output('blob'); const url = URL.createObjectURL(pdfBlob);
                const a = document.createElement('a'); a.href = url; a.download = fileName.trim() + '.pdf';
                document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(url), 1000);
            } catch(err) { alert('PDF 오류: ' + err.message); } finally { btn.innerHTML = origHtml; btn.disabled = false; }
        });

        initUI();
    </script>
</body>
</html>
